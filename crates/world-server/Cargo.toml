[package]
name = "world-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authoritative Aigent Place world server"
publish = false

[lib]
name = "world_server"
path = "src/lib.rs"

[[bin]]
name = "world-server"
path = "src/main.rs"

[dependencies]
aigent-protocol = { path = "../aigent-protocol" }
hex = "0.4.3"
hmac = "0.12.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = { version = "0.8.4", features = ["ws"] }
futures-util = "0.3.31"
bytes = "1.10.1"
prost = "0.13.5"

[dev-dependencies]
tokio-tungstenite = "0.26.2"
http = "1.3.1"

[lints]
workspace = true
