<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aigent Place Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Aigent Place</h1>
      <p id="status" role="status">starting</p>
      <div id="view-tools">
        <button id="reset-view" type="button" disabled>Reset view</button>
        <p id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</p>
      </div>
      <div id="world-view">
        <canvas id="viewport" aria-label="Read-only world viewport"></canvas>
        <p id="scene-state" role="status">Connecting to the world server.</p>
      </div>
      <p id="reference">Reference grid: 1 m squares, 20 m span at the fitted body height. Placeholder cubes; no terrain.</p>
      <p id="connection-hint">Server: <code>?ws=ws://127.0.0.1:7600/ws</code></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
